plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace "com.sample.cryptocurrencyapp"
    compileSdk 35

    defaultConfig {
        applicationId "com.sample.cryptocurrencyapp"
        minSdk 25
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation "androidx.compose.ui:ui:1.6.8" // Assuming a recent stable version, aligned with other compose libs if possible
    implementation "androidx.compose.material3:material3-window-size-class:1.3.2"
    implementation "androidx.compose.ui:ui-tooling-preview:1.6.8" // Assuming a recent stable version
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    testImplementation 'junit:junit:4.13.2' // Updated junit to a more recent version
    androidTestImplementation 'androidx.test.ext:junit:1.2.1' // Updated androidx test ext junit
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1' // Updated espresso
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.6.8" // Assuming a recent stable version
    debugImplementation "androidx.compose.ui:ui-tooling:1.6.8" // Assuming a recent stable version

    // Test dependencies
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    testImplementation "io.mockk:mockk:1.13.11"
    testImplementation "app.cash.turbine:turbine:1.1.0"

    // Compose dependencies
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0"
    implementation "androidx.navigation:navigation-compose:2.9.0"
    // implementation "com.google.accompanist:accompanist-flowlayout:0.17.0" // Removed as deprecated

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Coroutine Lifecycle Scopes are covered by lifecycle-runtime-ktx

    //Dagger - Hilt
    implementation "com.google.dagger:hilt-android:2.56.2"
    kapt "com.google.dagger:hilt-compiler:2.56.2"
    implementation "androidx.hilt:hilt-lifecycle-viewmodel:1.0.0-alpha03" // Kept as is, noted for review
    kapt "androidx.hilt:hilt-compiler:1.0.0" // This might be redundant if using com.google.dagger:hilt-compiler
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
}